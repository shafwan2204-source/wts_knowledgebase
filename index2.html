<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultraman Hensem - WTS Travel Ops AI</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-panel: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --border-subtle: #334155;
      --border-accent: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-logo-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
    }

    .brand-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 500;
    }

    .status-badge.neutral {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .status-badge.emerald {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-badge.amber {
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .status-badge.rose {
      background: rgba(244, 63, 94, 0.1);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .reset-btn {
      background: var(--bg-surface);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    #chatBox::-webkit-scrollbar { width: 4px; }
    #chatBox::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }

    .msg-row.user { justify-content: flex-end; }

    .avatar-img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      margin-top: 1px;
    }

    .avatar.me {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-blue);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .bubble {
      padding: 6px 36px 6px 10px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 75%;
      width: fit-content;
      border-radius: 8px;
      word-break: break-word;
      position: relative;
    }

    .bubble.ai {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      border-top-left-radius: 2px;
      white-space: normal;
    }

    .bubble.user {
      background: var(--accent-blue);
      color: #ffffff;
      border-top-right-radius: 2px;
      padding-right: 10px;
      white-space: pre-wrap;
    }

    .copy-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
      line-height: 1;
      z-index: 2;
    }

    .copy-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-color: var(--accent-blue);
    }

    .copy-btn.copied {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .bubble-content {
      display: block;
      margin: 0;
      padding: 0;
    }

    .bubble p {
      margin: 0;
      padding: 0;
      line-height: 1.4;
    }
    .bubble p + p {
      margin-top: 4px;
    }
    
    .bubble *:last-child,
    .bubble-content > *:last-child {
      margin-bottom: 0 !important;
    }

    .bubble strong { color: #f8fafc; font-weight: 600; }
    .bubble em { color: #93c5fd; }
    
    .bubble h2 {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin: 6px 0 2px 0;
      padding: 0;
    }
    .bubble h2:first-child { margin-top: 0; }

    .bubble h3 {
      font-size: 12.5px;
      font-weight: 600;
      color: #93c5fd;
      margin: 4px 0 2px 0;
      padding: 0;
    }
    .bubble h3:first-child { margin-top: 0; }

    .bubble ul, .bubble ol {
      margin: 3px 0 3px 14px;
      padding: 0;
    }
    .bubble li { margin-bottom: 2px; }

    .bubble blockquote {
      border-left: 3px solid var(--accent-blue);
      background: rgba(59, 130, 246, 0.08);
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 0 4px 4px 0;
      color: #cbd5e1;
    }
    
    /* High-contrast accessible links */
    a {
      color: #38bdf8;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-thickness: 1px;
      word-break: break-all;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }
    a:hover {
      color: #7dd3fc;
      text-decoration-color: #7dd3fc;
    }

    .bubble.ai a {
      color: #38bdf8;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(56, 189, 248, 0.6);
      word-break: break-all;
    }
    .bubble.ai a:hover {
      color: #bae6fd;
      text-decoration-color: #bae6fd;
    }

    .bubble.user a {
      color: #ffffff;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(255, 255, 255, 0.85);
      word-break: break-all;
    }
    .bubble.user a:hover {
      color: #fef08a;
      text-decoration-color: #fef08a;
    }

    .announcement-body a {
      color: #fbbf24;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(251, 191, 36, 0.7);
      word-break: break-all;
    }
    .announcement-body a:hover {
      color: #fef08a;
      text-decoration-color: #fef08a;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 4px 0;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .bubble table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .bubble th {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
      font-weight: 600;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .bubble td {
      padding: 4px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
    }

    .bubble tr:last-child td { border-bottom: none; }
    .bubble tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }

    .typing-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      width: auto !important;
    }
    .dot {
      width: 4px;
      height: 4px;
      background: #64748b;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .announcement-bar {
      background: rgba(245, 158, 11, 0.08);
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      padding: 7px 16px;
      flex-shrink: 0;
    }

    .announcement-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 12px;
      color: #fde68a;
      line-height: 1.45;
    }

    .announcement-tag {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2.5px 7px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      margin-top: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .announcement-body {
      flex: 1;
      word-break: break-word;
      min-width: 0;
    }

    .announcement-body p {
      margin: 0;
      line-height: 1.45;
    }

    .announcement-body p + p {
      margin-top: 4px;
    }

    .announcement-body ol, .announcement-body ul {
      margin: 0;
      padding-left: 18px;
    }

    .announcement-body li {
      margin-bottom: 2px;
      line-height: 1.45;
    }

    .announcement-body li:last-child {
      margin-bottom: 0;
    }

    .announcement-close {
      background: transparent;
      border: none;
      color: #fbbf24;
      cursor: pointer;
      font-size: 13px;
      padding: 1px 4px;
      border-radius: 3px;
      opacity: 0.7;
      transition: opacity 0.15s;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .announcement-close:hover {
      opacity: 1;
      background: rgba(245, 158, 11, 0.15);
    }

    footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px;
      flex-shrink: 0;
    }

    .footer-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .input-box { display: flex; gap: 8px; align-items: flex-end; }

    textarea {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: #f8fafc;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      min-height: 36px;
      max-height: 100px;
      overflow-y: auto;
      box-sizing: border-box;
      transition: height 0.1s ease;
    }

    textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .send-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      height: 36px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .send-btn:hover { background: var(--accent-blue-hover); }
    button:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10" alt="Ultraman Hensem" class="badge-logo-img" />
      <div>
        <div class="brand-title">Ultraman Hensem</div>
        <div class="brand-sub">WTS Travel Operations & Call Centre Assistant</div>
      </div>
    </div>
    <div class="header-badges">
      <div class="status-badge neutral" id="lastSyncBadge">
        <span>🕒 Synced: --:--:--</span>
      </div>
      <div class="status-badge amber" id="kbBadge">
        <div class="status-dot"></div>
        <span id="kbBadgeText">Connecting...</span>
      </div>
      <div class="status-badge emerald" id="engineBadge">
        <div class="status-dot"></div>
        <span id="badgeText">3.5 Flash-Lite</span>
      </div>
      <button class="reset-btn" type="button" onclick="resetChat()">↺ Reset Chat</button>
    </div>
  </header>

  <div id="announcementBanner" class="announcement-bar" style="display: none;">
    <div class="announcement-wrap">
      <span class="announcement-tag">📢 ANNOUNCEMENT</span>
      <div class="announcement-body" id="announcementText"></div>
      <button type="button" class="announcement-close" onclick="closeAnnouncement()" title="Dismiss">✕</button>
    </div>
  </div>

  <main id="chatBox">
    <div class="msg-row">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10" alt="Ultraman Hensem" class="avatar-img" />
      <div class="bubble ai" id="bubble-welcome">
        <button type="button" class="copy-btn" id="btn-copy-welcome" onclick="copyMessage('welcome')" title="Copy message">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Copy</span>
        </button>
        <div class="bubble-content"><strong>Yo bro! Ultraman Hensem is here. 😎</strong> Ready to help with WTS SOPs & schedules. <em>(Always doubt AI output & verify with Team Lead if unsure!)</em></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="Connecting knowledge base..." disabled onkeydown="handleKey(event)" oninput="autoResizeTextarea(this)"></textarea>
        <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
      </div>
    </div>
  </footer>

  <script>
    let GEMINI_API_KEY = window.GEMINI_API_KEY || "";
    const AVATAR_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10";

    const PRIMARY_MODEL = "gemini-3.5-flash-lite";
    const FALLBACK_MODEL = "gemini-3.8-flash";
    const MAX_HISTORY_TURNS = 10; // Sliding window: keep last 10 messages for prompt efficiency

    const PERSONA_HEADER = `SYSTEM INSTRUCTION: DUAL-MODE PERSONA (WORK KNOWLEDGE VS CASUAL BUDDY)

IDENTITY:
Your name is Ultraman Hensem. You are the dedicated AI Assistant for WTS Travel Call Centre & Operations.

CORE PRINCIPLE - AGENT SKEPTICISM & DISCRETION:
- Agents must ALWAYS maintain a healthy doubt regarding all AI-generated content.
- Agents must never blindly trust or commit AI answers to customers.
- If an agent is in any way unsure, has suspicions of inaccuracy, or encounters unlisted scenarios, they MUST stop and clarify directly with their Team Lead before replying to or committing with the customer.

1. INTENT CLASSIFICATION:
CONDITION A: WORK-RELATED QUERY (HIGH CONFIDENCE: 85% AND ABOVE)
- Source of Truth: Answer strictly and accurately using the MASTER KNOWLEDGE BASE below.
- Tone: Professional, clear, concise, and structured (Call Centre / Customer Support Lead standard).
- Rules: Never guess or extrapolate policies, contacts, or pricing rules. Follow operational directives strictly (such as coach pricing stop notice, complaint workflows, TBF collection steps). Keep responses compact with zero wasted lines.

CONDITION B: NON-WORK RELATED QUERY
- Persona: Close friend / bro / kawan (as Ultraman Hensem).
- Tone and Style: Casual, warm, witty, and grounded using natural Malaysian English / Manglish / BM slang (particles like lah, meh, bro, kan, jom, steady, ngam, settle, walao naturally).

2. AMBIGUOUS, UNCLEAR, OR INCOMPLETE INQUIRIES (PROBING PROTOCOL):
- If you are not completely sure what the agent is asking, or if critical context is missing (e.g., booking channel like Easybook vs Direct, travel dates, coach-only vs tour package, nationality, specific branch):
- DO NOT assume, guess, or dump generic policy text.
- PROBE THE AGENT FIRST: Ask 1 to 2 direct, friendly clarifying questions to understand the exact situation before giving an operational answer.

3. CONFIDENCE LEVEL LESS THAN 85% (OR PARTIAL / UNLISTED INFORMATION):
- Internal Evaluation Only: NEVER mention confidence scores, numbers, or percentages (e.g. do NOT say "confidence under 85%") to the agent. Keep confidence metrics strictly to yourself.
- Response Protocol:
  1. State clearly what information is currently available/documented in the records without making assumptions.
  2. Clearly flag that this specific case or nuance is not explicitly documented.
  3. Formally instruct the agent to seek help from their Team Lead to confirm before replying or committing to the customer.
  Advisory template:
  "Based on current records, [state what is currently documented]. However, as this specific scenario is not explicitly documented, please check with your Team Lead to confirm before confirming with the customer."

4. NATURAL & HUMANE ACKNOWLEDGEMENTS (AVOID ROBOTIC REPETITION):
- Never repeat the exact same canned catchphrase (e.g., do NOT say "Aduh bro, Ultraman Hensem setelkan!" every time). Be humane, varied, and natural.
- Adapt your opening dynamically:
  - "Steady bro, here is what the records show:"
  - "Got it, let me check the SOP for you:"
  - "Boleh, here are the details on that:"
  - "No problem kawan, here is how we handle this:"
  - "Ngam, here is the info you need:"
  - Or jump straight into the structured answer when appropriate without forced chatter.

================================================================================
MASTER KNOWLEDGE BASE:
================================================================================
`;

    let dynamicSystemPrompt = "";
    let kbLoaded = false;
    let syncTimer = null;
    let chatHistory = [];
    const messageStore = {
      welcome: "Yo bro! Ultraman Hensem is here. 😎 Ready to help with WTS SOPs & schedules. <em>(Always doubt AI output & verify with Team Lead if unsure!)</em>"
    };

    // 1. Handshake Listener: Receive key from desktop wrapper via postMessage
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SET_KEY' && event.data.apiKey) {
        GEMINI_API_KEY = event.data.apiKey;
        window.GEMINI_API_KEY = event.data.apiKey;
        checkReadyState();
      }
    });

    // 2. Proactively ask parent for key if embedded in iframe
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'REQUEST_KEY' }, '*');
    }

    // 3. Fallback poll in case window.GEMINI_API_KEY was set after initial parse
    const keyCheckInterval = setInterval(() => {
      if (!GEMINI_API_KEY && window.GEMINI_API_KEY) {
        GEMINI_API_KEY = window.GEMINI_API_KEY;
        checkReadyState();
        clearInterval(keyCheckInterval);
      } else if (GEMINI_API_KEY) {
        clearInterval(keyCheckInterval);
      }
    }, 200);

    const TARGET_FILE = "https://raw.githubusercontent.com/shafwan2204-source/wts_knowledgebase/refs/heads/main/knowledge_base.txt";
    const ANNOUNCEMENT_FILE = "https://raw.githubusercontent.com/shafwan2204-source/wts_knowledgebase/refs/heads/main/announcement.txt";
    let currentAnnouncement = "";

    async function fetchAnnouncement() {
      const ts = Date.now();
      const endpoints = [
        `${ANNOUNCEMENT_FILE}?t=${ts}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(ANNOUNCEMENT_FILE + '?t=' + ts)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(ANNOUNCEMENT_FILE + '?t=' + ts)}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetchWithTimeout(url, 4000);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 0 && !text.includes("404: Not Found")) {
              return text.trim();
            }
          }
        } catch (e) {}
      }
      return "";
    }

    function updateAnnouncementUI(text) {
      const banner = document.getElementById('announcementBanner');
      const body = document.getElementById('announcementText');
      if (!banner || !body) return;

      if (text && text.length > 0) {
        body.innerHTML = simpleMarkdown(text);
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    }

    function closeAnnouncement() {
      const banner = document.getElementById('announcementBanner');
      if (banner) banner.style.display = 'none';
    }


    function updateSyncTimerDisplay() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('lastSyncBadge').innerHTML = `<span>🕒 Synced: ${timeStr}</span>`;
    }

    async function fetchWithTimeout(url, timeoutMs = 4000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    async function tryFetchKB() {
      if (window.PRELOADED_KB && window.PRELOADED_KB.trim().length > 100) {
        const text = window.PRELOADED_KB;
        window.PRELOADED_KB = null;
        return text;
      }

      const ts = Date.now();
      const endpoints = [
        `${TARGET_FILE}?t=${ts}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(TARGET_FILE + '?t=' + ts)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(TARGET_FILE + '?t=' + ts)}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetchWithTimeout(url, 4000);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 100) {
              return text;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function checkReadyState() {
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      if (kbLoaded && GEMINI_API_KEY) {
        input.disabled = false;
        btn.disabled = false;
        input.placeholder = "Ask Ultraman Hensem anything or chat casually...";
        input.focus();
      } else if (kbLoaded && !GEMINI_API_KEY) {
        input.disabled = true;
        btn.disabled = true;
        input.placeholder = "Waiting for desktop API handshake...";
      }
    }

    async function syncKnowledgeBase() {
      const kbBadge = document.getElementById('kbBadge');
      const kbBadgeText = document.getElementById('kbBadgeText');

      if (!kbLoaded) {
        kbBadge.className = "status-badge amber";
        kbBadgeText.innerText = "Connecting...";
      }

      const [fetchedText, fetchedAnnouncement] = await Promise.all([
        tryFetchKB(),
        fetchAnnouncement()
      ]);

      if (fetchedAnnouncement !== undefined) {
        currentAnnouncement = fetchedAnnouncement;
        updateAnnouncementUI(currentAnnouncement);
      }

      if (fetchedText) {
        let fullPrompt = PERSONA_HEADER;
        if (currentAnnouncement) {
          fullPrompt += `\n================================================================================\nPRIORITY LIVE ANNOUNCEMENT FOR AGENTS:\n${currentAnnouncement}\n================================================================================\n`;
        }
        fullPrompt += fetchedText;
        dynamicSystemPrompt = fullPrompt;
        kbLoaded = true;

        kbBadge.className = "status-badge emerald";
        kbBadgeText.innerText = "Connected";
        updateSyncTimerDisplay();
        checkReadyState();

        console.log("Knowledge Base refreshed seamlessly in background.");
        
        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(syncKnowledgeBase, 60000);
      } else {
        if (!kbLoaded) {
          kbBadge.className = "status-badge rose";
          kbBadgeText.innerText = "Retrying in 3s...";
          if (syncTimer) clearTimeout(syncTimer);
          syncTimer = setTimeout(syncKnowledgeBase, 3000);
        } else {
          console.warn("Background auto-refresh failed to fetch update; retained current knowledge base.");
          if (syncTimer) clearTimeout(syncTimer);
          syncTimer = setTimeout(syncKnowledgeBase, 60000);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", syncKnowledgeBase);

    function updateBadge(modelName, isFallback = false) {
      const badge = document.getElementById('engineBadge');
      const text = document.getElementById('badgeText');
      if (isFallback) {
        badge.className = "status-badge amber";
        text.innerText = `${modelName} (Fallback)`;
      } else {
        badge.className = "status-badge emerald";
        text.innerText = `${modelName}`;
      }
    }

    function resetChat() {
      chatHistory = [];
      const box = document.getElementById('chatBox');
      box.innerHTML = `
        <div class="msg-row">
          <img src="${AVATAR_URL}" alt="Ultraman Hensem" class="avatar-img" />
          <div class="bubble ai" id="bubble-welcome">
            <button type="button" class="copy-btn" id="btn-copy-welcome" onclick="copyMessage('welcome')" title="Copy message">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copy</span>
            </button>
            <div class="bubble-content"><strong>Chat reset! Screen is clean now, bro. 🧹✨</strong> Ready to help with WTS SOPs & schedules. <em>(Always doubt AI output & verify with Team Lead if unsure!)</em></div>
          </div>
        </div>
      `;
      const input = document.getElementById('userInput');
      input.value = '';
      input.style.height = 'auto';
      input.focus();
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function copyMessage(msgId) {
      const text = messageStore[msgId];
      if (!text) return;

      const btn = document.getElementById(`btn-copy-${msgId}`);
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(text, btn));
      } else {
        fallbackCopy(text, btn);
      }
    }

    function fallbackCopy(text, btn) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showCopied(btn);
      } catch (err) {
        console.error('Copy fallback failed:', err);
      }
      document.body.removeChild(ta);
    }

    function showCopied(btn) {
      if (!btn) return;
      const originalHtml = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = `<span>Copied! ✓</span>`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = originalHtml;
      }, 2000);
    }

    function cleanCitations(text) {
      return text.replace(/\[cite:\s*[\d,\s]+\]/gi, '');
    }

    function parseTableRow(line) {
      let parts = line.split('|').map(s => s.trim());
      if (parts.length > 1 && parts[0] === '') parts.shift();
      if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
      return parts;
    }

    function renderMarkdownTable(rows) {
      if (rows.length === 0) return '';
      let out = '<div class="table-container"><table>';
      let startIndex = 0;
      if (rows.length > 1 && /^[\s|:-]+$/.test(rows[1])) {
        out += '<thead><tr>';
        const headers = parseTableRow(rows[0]);
        headers.forEach(h => { out += `<th>${h}</th>`; });
        out += '</tr></thead><tbody>';
        startIndex = 2;
      } else {
        out += '<tbody>';
      }
      for (let r = startIndex; r < rows.length; r++) {
        out += '<tr>';
        const cells = parseTableRow(rows[r]);
        cells.forEach(c => { out += `<td>${c}</td>`; });
        out += '</tr>';
      }
      out += '</tbody></table></div>';
      return out;
    }

    function simpleMarkdown(text) {
      let t = cleanCitations(text);

      t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');

      const links = [];
      t = t.replace(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, (match, label, url) => {
        const id = `%%LINK_${links.length}%%`;
        links.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
        return id;
      });

      t = t.replace(/\b(https?:\/\/[^\s<]+)/g, (match, url) => {
        let cleanUrl = url;
        let suffix = '';
        while (cleanUrl.length > 0 && /[.,!?;:'")\]}]$/.test(cleanUrl)) {
          suffix = cleanUrl.slice(-1) + suffix;
          cleanUrl = cleanUrl.slice(0, -1);
        }
        return `<a href="${cleanUrl}" target="_blank" rel="noopener">${cleanUrl}</a>${suffix}`;
      });

      links.forEach((linkHtml, idx) => {
        t = t.replace(`%%LINK_${idx}%%`, linkHtml);
      });

      const lines = t.split('\n');
      let html = '';
      let inUl = false;
      let inOl = false;
      let inTable = false;
      let tableRows = [];

      function closeBlocks() {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
        if (inTable) { html += renderMarkdownTable(tableRows); inTable = false; tableRows = []; }
      }

      for (let line of lines) {
        let trimmed = line.trim();

        if (trimmed.includes('|') && (trimmed.startsWith('|') || trimmed.endsWith('|') || /^[^|]+(\s*\|\s*[^|]+)+$/.test(trimmed))) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (inOl) { html += '</ol>'; inOl = false; }
          inTable = true;
          tableRows.push(trimmed);
          continue;
        } else if (inTable) {
          html += renderMarkdownTable(tableRows);
          inTable = false;
          tableRows = [];
        }

        if (trimmed.startsWith('### ')) {
          closeBlocks();
          html += `<h3>${trimmed.substring(4)}</h3>`;
        } else if (trimmed.startsWith('## ')) {
          closeBlocks();
          html += `<h2>${trimmed.substring(3)}</h2>`;
        } else if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${trimmed.substring(2)}</li>`;
        } else if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${trimmed.replace(/^\d+\.\s+/, '')}</li>`;
        } else if (trimmed.startsWith('&gt; ') || trimmed.startsWith('> ')) {
          closeBlocks();
          const bqContent = trimmed.replace(/^(&gt;|>)\s*/, '');
          html += `<blockquote>${bqContent}</blockquote>`;
        } else {
          closeBlocks();
          if (trimmed.length > 0) {
            html += `<p>${trimmed}</p>`;
          }
        }
      }
      closeBlocks();
      return html;
    }

    async function callGemini(modelName, history) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${GEMINI_API_KEY}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: dynamicSystemPrompt }] },
            contents: history,
            generationConfig: { temperature: 0.2, maxOutputTokens: 1500 }
          }),
          signal: controller.signal
        });
        clearTimeout(timer);
        const data = await res.json();
        return { status: res.status, ok: res.ok, data };
      } catch (err) {
        clearTimeout(timer);
        return { status: 0, ok: false, error: err };
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text || !kbLoaded || !GEMINI_API_KEY) return;

      input.value = '';
      input.style.height = 'auto';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;

      appendMsg('user', text);
      const typingId = showTyping();

      chatHistory.push({ role: "user", parts: [{ text }] });

      try {
        const historyPayload = chatHistory.slice(-MAX_HISTORY_TURNS);
        let response = await callGemini(PRIMARY_MODEL, historyPayload);

        if (!response.ok) {
          console.warn(`Primary model ${PRIMARY_MODEL} returned ${response.status}. Falling back to: ${FALLBACK_MODEL}`);
          updateBadge("3.8 Flash", true);
          response = await callGemini(FALLBACK_MODEL, historyPayload);
        } else {
          updateBadge("3.5 Flash-Lite", false);
        }

        removeTyping(typingId);

        if (response.ok && response.data?.candidates?.[0]?.content?.parts?.[0]?.text) {
          const rawReply = response.data.candidates[0].content.parts[0].text;
          const cleanReply = cleanCitations(rawReply);
          appendMsg('ai', cleanReply);
          chatHistory.push({ role: "model", parts: [{ text: cleanReply }] });

          if (chatHistory.length > 30) {
            chatHistory = chatHistory.slice(-20);
          }
        } else {
          const err = response.data?.error?.message || response.error?.message || "Service error. Please try again.";
          appendMsg('ai', `⚠️ **Service Alert:** ${err}`);
        }
      } catch (err) {
        removeTyping(typingId);
        appendMsg('ai', `⚠️ **Connection error:** ${err.message || 'Check network connection.'}`);
      } finally {
        input.disabled = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function appendMsg(role, text) {
      const box = document.getElementById('chatBox');
      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user' : ''}`;

      if (role === 'ai') {
        const msgId = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        messageStore[msgId] = text;

        row.innerHTML = `
          <img src="${AVATAR_URL}" alt="Ultraman Hensem" class="avatar-img" />
          <div class="bubble ai" id="bubble-${msgId}">
            <button type="button" class="copy-btn" id="btn-copy-${msgId}" onclick="copyMessage('${msgId}')" title="Copy message">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copy</span>
            </button>
            <div class="bubble-content">${simpleMarkdown(text)}</div>
          </div>
        `;
      } else {
        row.innerHTML = `
          <div class="bubble user">${text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
          <div class="avatar me">ME</div>
        `;
      }
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function showTyping() {
      const box = document.getElementById('chatBox');
      const id = 'loader-' + Date.now();
      const row = document.createElement('div');
      row.id = id;
      row.className = 'msg-row';
      row.innerHTML = `
        <img src="${AVATAR_URL}" alt="Ultraman Hensem" class="avatar-img" />
        <div class="bubble ai typing-box">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
      return id;
    }

    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
