<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultraman Hensem - WTS Travel Ops AI</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-panel: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --border-subtle: #334155;
      --border-accent: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-logo-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
    }

    .brand-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 500;
    }

    .status-badge.neutral {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .status-badge.emerald {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-badge.amber {
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .status-badge.rose {
      background: rgba(244, 63, 94, 0.1);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .reset-btn {
      background: var(--bg-surface);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
        .header-btn {
      background: var(--bg-surface);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .header-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-color: var(--accent-blue);
    }
    .header-btn.active {
      background: rgba(59, 130, 246, 0.25);
      color: #60a5fa;
      border-color: var(--accent-blue);
    }

    /* Comfortable text density */
    body.density-comfortable .bubble {
      font-size: 14.5px;
      line-height: 1.5;
      padding: 8px 40px 8px 12px;
    }
    body.density-comfortable .bubble.user {
      padding-right: 12px;
    }
    body.density-comfortable textarea {
      font-size: 14px;
    }

    /* Search bar */
    .search-bar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 16px;
      flex-shrink: 0;
    }
    .search-bar-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-icon {
      font-size: 12px;
      opacity: 0.7;
    }
    #chatSearchInput {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: #f8fafc;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      outline: none;
    }
    #chatSearchInput:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .search-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
    }
    .search-nav-btn, .search-close-btn {
      background: var(--bg-surface);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .search-nav-btn:hover, .search-close-btn:hover {
      background: var(--bg-surface-hover);
      color: #ffffff;
    }
    .search-highlight {
      background: rgba(245, 158, 11, 0.45);
      color: #ffffff;
      padding: 1px 2px;
      border-radius: 2px;
    }
    .search-highlight.active {
      background: #f59e0b;
      color: #000000;
      font-weight: 700;
    }

    /* Error Bubble & Retry */
    .bubble.ai.error {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.08);
      color: #fecdd3;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .retry-btn:hover {
      background: rgba(244, 63, 94, 0.3);
      color: #ffffff;
      border-color: rgba(244, 63, 94, 0.6);
    }

    .reset-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    #chatBox::-webkit-scrollbar { width: 4px; }
    #chatBox::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }

    .msg-row.user { justify-content: flex-end; }

    .avatar-img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      margin-top: 1px;
    }

    .avatar.me {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-blue);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .bubble {
      padding: 6px 36px 6px 10px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 75%;
      width: fit-content;
      border-radius: 8px;
      word-break: break-word;
      position: relative;
    }

    .bubble.ai {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      border-top-left-radius: 2px;
      white-space: normal;
    }

    .bubble.user {
      background: var(--accent-blue);
      color: #ffffff;
      border-top-right-radius: 2px;
      padding-right: 10px;
      white-space: pre-wrap;
    }

    .copy-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
      line-height: 1;
      z-index: 2;
    }

    .copy-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-color: var(--accent-blue);
    }

    .copy-btn.copied {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .bubble-content {
      display: block;
      margin: 0;
      padding: 0;
    }

    .bubble p {
      margin: 0;
      padding: 0;
      line-height: 1.4;
    }
    .bubble p + p {
      margin-top: 4px;
    }
    
    .bubble *:last-child,
    .bubble-content > *:last-child {
      margin-bottom: 0 !important;
    }

    .bubble strong { color: #f8fafc; font-weight: 600; }
    .bubble em { color: #93c5fd; }
    
    .bubble h2 {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin: 6px 0 2px 0;
      padding: 0;
    }
    .bubble h2:first-child { margin-top: 0; }

    .bubble h3 {
      font-size: 12.5px;
      font-weight: 600;
      color: #93c5fd;
      margin: 4px 0 2px 0;
      padding: 0;
    }
    .bubble h3:first-child { margin-top: 0; }

    .bubble ul, .bubble ol {
      margin: 3px 0 3px 14px;
      padding: 0;
    }
    .bubble li { margin-bottom: 2px; }

    .bubble blockquote {
      border-left: 3px solid var(--accent-blue);
      background: rgba(59, 130, 246, 0.08);
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 0 4px 4px 0;
      color: #cbd5e1;
    }
    
    /* High-contrast accessible links */
    a {
      color: #38bdf8;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-thickness: 1px;
      word-break: break-all;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }
    a:hover {
      color: #7dd3fc;
      text-decoration-color: #7dd3fc;
    }

    .bubble.ai a {
      color: #38bdf8;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(56, 189, 248, 0.6);
      word-break: break-all;
    }
    .bubble.ai a:hover {
      color: #bae6fd;
      text-decoration-color: #bae6fd;
    }

    .bubble.user a {
      color: #ffffff;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(255, 255, 255, 0.85);
      word-break: break-all;
    }
    .bubble.user a:hover {
      color: #fef08a;
      text-decoration-color: #fef08a;
    }

    .announcement-body a {
      color: #fbbf24;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      text-decoration-color: rgba(251, 191, 36, 0.7);
      word-break: break-all;
    }
    .announcement-body a:hover {
      color: #fef08a;
      text-decoration-color: #fef08a;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 4px 0;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .bubble table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .bubble th {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
      font-weight: 600;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .bubble td {
      padding: 4px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
    }

    .bubble tr:last-child td { border-bottom: none; }
    .bubble tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }

    .typing-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      width: auto !important;
    }
    .dot {
      width: 4px;
      height: 4px;
      background: #64748b;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .announcement-bar {
      background: rgba(245, 158, 11, 0.08);
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      padding: 7px 16px;
      flex-shrink: 0;
    }

    .announcement-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 12px;
      color: #fde68a;
      line-height: 1.45;
    }

    .announcement-tag {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2.5px 7px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      margin-top: 1px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .announcement-body {
      flex: 1;
      word-break: break-word;
      min-width: 0;
    }

    .announcement-body p {
      margin: 0;
      line-height: 1.45;
    }

    .announcement-body p + p {
      margin-top: 4px;
    }

    .announcement-body ol, .announcement-body ul {
      margin: 0;
      padding-left: 18px;
    }

    .announcement-body li {
      margin-bottom: 2px;
      line-height: 1.45;
    }

    .announcement-body li:last-child {
      margin-bottom: 0;
    }

    .announcement-close {
      background: transparent;
      border: none;
      color: #fbbf24;
      cursor: pointer;
      font-size: 13px;
      padding: 1px 4px;
      border-radius: 3px;
      opacity: 0.7;
      transition: opacity 0.15s;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .announcement-close:hover {
      opacity: 1;
      background: rgba(245, 158, 11, 0.15);
    }

    footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px;
      flex-shrink: 0;
    }

    .footer-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .input-box { display: flex; gap: 8px; align-items: flex-end; }

    textarea {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: #f8fafc;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      min-height: 36px;
      max-height: 100px;
      overflow-y: auto;
      box-sizing: border-box;
      transition: height 0.1s ease;
    }

    textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .send-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      height: 36px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .send-btn:hover { background: var(--accent-blue-hover); }
    button:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10" alt="Ultraman Hensem" class="badge-logo-img" />
      <div>
        <div class="brand-title">Ultraman Hensem</div>
        <div class="brand-sub">WTS Travel Operations & Call Centre Assistant</div>
      </div>
    </div>
    <div class="header-badges">
      <div class="status-badge neutral" id="lastSyncBadge">
        <span>🕒 Synced: --:--:--</span>
      </div>
      <div class="status-badge amber" id="kbBadge">
        <div class="status-dot"></div>
        <span id="kbBadgeText">Connecting...</span>
      </div>
      <div class="status-badge emerald" id="engineBadge">
        <div class="status-dot"></div>
        <span id="badgeText">3.5 Flash-Lite</span>
      </div>
      <button class="header-btn" type="button" id="searchToggleBtn" onclick="toggleSearch()" title="Search conversation (Ctrl+F)">🔍 Find</button>
      <button class="header-btn" type="button" id="fontSizeBtn" onclick="toggleFontSize()" title="Toggle text size (Compact / Comfortable)">Aa</button>
      <button class="reset-btn" type="button" onclick="resetChat()" title="Clear chat history">↺ Reset Chat</button>
    </div>
  </header>

  <div id="chatSearchBar" class="search-bar" style="display: none;">
    <div class="search-bar-inner">
      <span class="search-icon">🔍</span>
      <input type="text" id="chatSearchInput" placeholder="Find in current chat (Enter: next, Shift+Enter: prev, Esc: close)..." oninput="handleSearch()" onkeydown="handleSearchKey(event)" />
      <span id="searchMatchCount" class="search-count">0/0</span>
      <button type="button" class="search-nav-btn" onclick="navSearch(-1)" title="Previous match (Shift+Enter)">▲</button>
      <button type="button" class="search-nav-btn" onclick="navSearch(1)" title="Next match (Enter)">▼</button>
      <button type="button" class="search-close-btn" onclick="closeSearch()" title="Close search (Esc)">✕</button>
    </div>
  </div>

  <div id="announcementBanner" class="announcement-bar" style="display: none;">
    <div class="announcement-wrap">
      <span class="announcement-tag">📢 ANNOUNCEMENT</span>
      <div class="announcement-body" id="announcementText"></div>
      <button type="button" class="announcement-close" onclick="closeAnnouncement()" title="Dismiss">✕</button>
    </div>
  </div>

  <main id="chatBox">
    <div class="msg-row">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10" alt="Ultraman Hensem" class="avatar-img" />
      <div class="bubble ai" id="bubble-welcome">
        <button type="button" class="copy-btn" id="btn-copy-welcome" onclick="copyMessage('welcome')" title="Copy message">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Copy</span>
        </button>
        <div class="bubble-content"><strong>Yo bro! Ultraman Hensem is here. 😎</strong> Ready to help with WTS SOPs & schedules. <em>(Always doubt AI output & verify with Team Lead if unsure!)</em></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="Connecting knowledge base..." disabled onkeydown="handleKey(event)" oninput="autoResizeTextarea(this)"></textarea>
        <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
      </div>
    </div>
  </footer>

  <script>
    let GEMINI_API_KEY = window.GEMINI_API_KEY || "";
    const AVATAR_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS42Xy7NB3R0Xy0MnT5mvmh2ovidQ7lE-tJKl9RDZ8EEchaE3n66Z5b6w&s=10";

    const PRIMARY_MODEL = "gemini-3.5-flash-lite";
    const FALLBACK_MODEL = "gemini-3.8-flash";
    const MAX_HISTORY_TURNS = 10; // Sliding window: keep last 10 messages for prompt efficiency

    // Webhook for logging enquiries to Google Sheets (Replace with your deployed Web App URL)
    const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbx73mzXiTilj7O_nEX9KQryIo2XjJkttKfhLnGQ5eUclDkWyF2AcQIB-iiPcBqlnEME/exec";

    const PERSONA_HEADER = `SYSTEM INSTRUCTION: ULTRAMAN HENSEM (WTS TRAVEL OPS ASSISTANT)

IDENTITY:
Your name is Ultraman Hensem. You are the dedicated, intelligent, and friendly AI assistant for WTS Travel Call Centre agents and operations.

CRITICAL OPERATIONAL DIRECTIVES (MANDATORY IN EVERY RESPONSE):

1. DIRECT ANSWERS FIRST (DO NOT OVER-PROBE):
- DEFAULT BEHAVIOR IS TO ANSWER DIRECTLY: When an agent asks a factual, policy, schedule, fare, contact, or operational question (e.g., "does coach stop at Yong Peng?", "Genting coach fare estimate", "cancellation policy", "branch operating hours", "luggage limit"):

    function cleanCitations(text) {

    function parseTableRow(line) {
      let parts = line.split('|').map(s => s.trim());
      if (parts.length > 1 && parts[0] === '') parts.shift();
      if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
      return parts;
    }

    function renderMarkdownTable(rows) {
      if (rows.length === 0) return '';
      let out = '<div class="table-container"><table>';
      let startIndex = 0;
      if (rows.length > 1 && /^[\s|:-]+$/.test(rows[1])) {
        out += '<thead><tr>';
        const headers = parseTableRow(rows[0]);
        headers.forEach(h => { out += `<th>${h}</th>`; });
        out += '</tr></thead><tbody>';
        startIndex = 2;
      } else {
        out += '<tbody>';
      }
      for (let r = startIndex; r < rows.length; r++) {
        out += '<tr>';
        const cells = parseTableRow(rows[r]);
        cells.forEach(c => { out += `<td>${c}</td>`; });
        out += '</tr>';
      }
      out += '</tbody></table></div>';
      return out;
    }

    function simpleMarkdown(text) {
      let t = cleanCitations(text);

      t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');

      const links = [];
      t = t.replace(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, (match, label, url) => {
        const id = `%%LINK_${links.length}%%`;
        links.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
        return id;
      });

      t = t.replace(/\b(https?:\/\/[^\s<]+)/g, (match, url) => {
        let cleanUrl = url;
        let suffix = '';
        while (cleanUrl.length > 0 && /[.,!?;:'")\]}]$/.test(cleanUrl)) {
          suffix = cleanUrl.slice(-1) + suffix;
          cleanUrl = cleanUrl.slice(0, -1);
        }
        return `<a href="${cleanUrl}" target="_blank" rel="noopener">${cleanUrl}</a>${suffix}`;
      });

      links.forEach((linkHtml, idx) => {
        t = t.replace(`%%LINK_${idx}%%`, linkHtml);
      });

      const lines = t.split('\n');
      let html = '';
      let inUl = false;
      let inOl = false;
      let inTable = false;
      let tableRows = [];

      function closeBlocks() {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
        if (inTable) { html += renderMarkdownTable(tableRows); inTable = false; tableRows = []; }
      }

      for (let line of lines) {
        let trimmed = line.trim();

        if (trimmed.includes('|') && (trimmed.startsWith('|') || trimmed.endsWith('|') || /^[^|]+(\s*\|\s*[^|]+)+$/.test(trimmed))) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (inOl) { html += '</ol>'; inOl = false; }
          inTable = true;
          tableRows.push(trimmed);
          continue;
        } else if (inTable) {
          html += renderMarkdownTable(tableRows);
          inTable = false;
          tableRows = [];
        }

        if (trimmed.startsWith('### ')) {
          closeBlocks();
          html += `<h3>${trimmed.substring(4)}</h3>`;
        } else if (trimmed.startsWith('## ')) {
          closeBlocks();
          html += `<h2>${trimmed.substring(3)}</h2>`;
        } else if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${trimmed.substring(2)}</li>`;
        } else if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${trimmed.replace(/^\d+\.\s+/, '')}</li>`;
        } else if (trimmed.startsWith('&gt; ') || trimmed.startsWith('> ')) {
          closeBlocks();
          const bqContent = trimmed.replace(/^(&gt;|>)\s*/, '');
          html += `<blockquote>${bqContent}</blockquote>`;
        } else {
          closeBlocks();
          if (trimmed.length > 0) {
            html += `<p>${trimmed}</p>`;
          }
        }
      }
      closeBlocks();
      return html;
    }

    async function callGemini(modelName, history) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${GEMINI_API_KEY}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: dynamicSystemPrompt }] },
            contents: history,
            generationConfig: { temperature: 0.2, maxOutputTokens: 1500 }
          }),
          signal: controller.signal
        });
        clearTimeout(timer);
        const data = await res.json();
        return { status: res.status, ok: res.ok, data };
      } catch (err) {
        clearTimeout(timer);
        return { status: 0, ok: false, error: err };
      }
    }

    function playNotificationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.09); // A5 note
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function triggerBackgroundAlert() {
      if (!document.hidden) return; // Only notify if tab is in background

      playNotificationChime();

      if (titleFlashTimer) clearInterval(titleFlashTimer);
      let isAlert = true;
      titleFlashTimer = setInterval(() => {
        if (!document.hidden) {
          clearBackgroundAlert();
          return;
        }
        document.title = isAlert ? "🔔 (1) Answer Ready - Ultraman Hensem" : ORIGINAL_TITLE;
        isAlert = !isAlert;
      }, 1000);
    }

    function clearBackgroundAlert() {
      if (titleFlashTimer) {
        clearInterval(titleFlashTimer);
        titleFlashTimer = null;
      }
      document.title = ORIGINAL_TITLE;
    }

    window.addEventListener('focus', clearBackgroundAlert);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) clearBackgroundAlert();
    });

    // 4. In-Chat Search (Ctrl+F)
    let searchMatches = [];
    let currentSearchIndex = -1;

    function toggleSearch() {
      const bar = document.getElementById('chatSearchBar');
      const input = document.getElementById('chatSearchInput');
      const btn = document.getElementById('searchToggleBtn');
      if (!bar) return;

      if (bar.style.display === 'none' || !bar.style.display) {
        bar.style.display = 'block';
        if (btn) btn.classList.add('active');
        if (input) {
          input.focus();
          input.select();
        }
        handleSearch();
      } else {
        closeSearch();
      }
    }

    function closeSearch() {
      const bar = document.getElementById('chatSearchBar');
      const btn = document.getElementById('searchToggleBtn');
      if (bar) bar.style.display = 'none';
      if (btn) btn.classList.remove('active');
      clearSearchHighlights();
      searchMatches = [];
      currentSearchIndex = -1;
      updateSearchCountUI();
      const userInput = document.getElementById('userInput');
      if (userInput && !userInput.disabled) userInput.focus();
    }

    function clearSearchHighlights() {
      const highlighted = document.querySelectorAll('.search-highlight');
      highlighted.forEach(el => {
        const parent = el.parentNode;
        if (parent) {
          parent.replaceChild(document.createTextNode(el.textContent), el);
          parent.normalize();
        }
      });
    }

    function handleSearchKey(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeSearch();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        navSearch(e.shiftKey ? -1 : 1);
      }
    }

    function handleSearch() {
      clearSearchHighlights();
      searchMatches = [];
      currentSearchIndex = -1;

      const input = document.getElementById('chatSearchInput');
      const query = input ? input.value.trim() : '';
      if (!query || query.length < 2) {
        updateSearchCountUI();
        return;
      }

      const bubbles = document.querySelectorAll('.bubble-content, .bubble.user');
      bubbles.forEach(container => {
        highlightTextNodes(container, query);
      });

      searchMatches = Array.from(document.querySelectorAll('.search-highlight'));
      if (searchMatches.length > 0) {
        currentSearchIndex = 0;
        highlightCurrentMatch();
      }
      updateSearchCountUI();
    }

    function highlightTextNodes(node, query) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        const lower = text.toLowerCase();
        const qLower = query.toLowerCase();
        const idx = lower.indexOf(qLower);
        if (idx !== -1) {
          const before = text.substring(0, idx);
          const match = text.substring(idx, idx + query.length);
          const after = text.substring(idx + query.length);

          const span = document.createElement('mark');
          span.className = 'search-highlight';
          span.textContent = match;

          const parent = node.parentNode;
          if (before) parent.insertBefore(document.createTextNode(before), node);
          parent.insertBefore(span, node);
          if (after) {
            const afterNode = document.createTextNode(after);
            parent.insertBefore(afterNode, node);
            highlightTextNodes(afterNode, query);
          }
          parent.removeChild(node);
        }
      } else if (node.nodeType === Node.ELEMENT_NODE && !node.classList.contains('copy-btn') && !node.classList.contains('retry-btn')) {
        Array.from(node.childNodes).forEach(child => highlightTextNodes(child, query));
      }
    }

    function navSearch(direction) {
      if (searchMatches.length === 0) return;
      currentSearchIndex += direction;
      if (currentSearchIndex >= searchMatches.length) currentSearchIndex = 0;
      if (currentSearchIndex < 0) currentSearchIndex = searchMatches.length - 1;
      highlightCurrentMatch();
      updateSearchCountUI();
    }

    function highlightCurrentMatch() {
      searchMatches.forEach((m, i) => {
        if (i === currentSearchIndex) {
          m.classList.add('active');
          m.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          m.classList.remove('active');
        }
      });
    }

    function updateSearchCountUI() {
      const el = document.getElementById('searchMatchCount');
      if (!el) return;
      if (searchMatches.length === 0) {
        el.textContent = "0/0";
      } else {
        el.textContent = `${currentSearchIndex + 1}/${searchMatches.length}`;
      }
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleSearch();
      }
    });

    // 5. 1-Click Inline Retry on Failed Requests
    function appendErrorMsg(err, failedQuery) {
      const box = document.getElementById('chatBox');
      const row = document.createElement('div');
      row.className = 'msg-row';
      const msgId = 'err-' + Date.now();
      row.id = msgId;

      row.innerHTML = `
        <img src="${AVATAR_URL}" alt="Ultraman Hensem" class="avatar-img" />
        <div class="bubble ai error">
          <div class="bubble-content">⚠️ <strong>Service Alert:</strong> ${err}</div>
          <button type="button" class="retry-btn" onclick="retryQuery('${encodeURIComponent(failedQuery)}', '${msgId}')">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            <span>Retry Question</span>
          </button>
        </div>
      `;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function retryQuery(encodedQuery, errRowId) {
      const errRow = document.getElementById(errRowId);
      if (errRow) errRow.remove();
      const query = decodeURIComponent(encodedQuery);
      if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
        chatHistory.pop();
      }
      sendMessage(query);
    }
  </script>
